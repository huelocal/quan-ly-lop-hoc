<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập - Hệ Thống Quản Lý (login.html)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b192c;
      background-image:
        linear-gradient(135deg, rgba(11, 25, 44, 0.72) 0%, rgba(14, 116, 144, 0.58) 50%, rgba(6, 78, 59, 0.75) 100%),
        url('https://images.unsplash.com/photo-1583417319070-4a69db38a482?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }
    .glass-login {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 text-white">

  <!-- Thanh trạng thái trên cùng -->
  <div class="max-w-5xl w-full mx-auto flex flex-wrap items-center justify-between gap-2 pt-1">
    <div class="flex items-center gap-2 text-xs bg-slate-950/50 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/15">
      <i class="fa-solid fa-building-columns text-cyan-300"></i>
      <span class="font-bold">THPT Chuyên Khoa Học Huế • ĐHKH Huế</span>
    </div>
    <div class="flex items-center gap-2">
      <span id="pageSyncStatus" class="text-xs bg-slate-950/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/15 text-cyan-200 font-medium">
        Real-time Sync Ready
      </span>
      <button onclick="promptGSheetUrl()" class="text-xs bg-emerald-500/90 hover:bg-emerald-500 text-slate-950 font-extrabold px-3 py-1.5 rounded-full shadow transition">
        <i class="fa-solid fa-link mr-1"></i>Gắn Link Google Sheet
      </button>
    </div>
  </div>

  <!-- Khung Đăng Nhập Trung Tâm (Bám sát Hình 1.1 Báo cáo NCKH) -->
  <main class="my-auto flex items-center justify-center py-6">
    <div class="w-full max-w-md glass-login rounded-3xl p-7 sm:p-9 relative overflow-hidden">
      <div class="text-center mb-7">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-white/20 border border-white/30 flex items-center justify-center mb-3 shadow-inner">
          <i class="fa-solid fa-graduation-cap text-2xl text-cyan-200"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black tracking-wider uppercase drop-shadow">HỆ THỐNG QUẢN LÝ</h1>
        <p class="text-xs text-cyan-100 mt-1">Đi trễ • Nghỉ phép • Đặt phòng học – làm việc</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-100 mb-1 ml-1">Mã định danh (ID)</label>
          <input id="loginUserId" type="text" value="HS01" placeholder="VD: HS01, HS02, PH01, GV01..."
            class="w-full px-4 py-3.5 rounded-2xl bg-white/95 text-slate-900 font-extrabold text-sm sm:text-base uppercase placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-cyan-400/50 shadow-inner" />
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-100 mb-1 ml-1">Họ và tên người dùng</label>
          <input id="loginUserName" type="text" value="NGÔ HOÀNG MINH ĐẠT" placeholder="Nhập họ và tên..."
            class="w-full px-4 py-3.5 rounded-2xl bg-white/95 text-slate-900 font-bold text-sm sm:text-base placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-cyan-400/50 shadow-inner" />
        </div>

        <!-- 3 Nút Đăng Nhập Riêng Biệt Chuyển Sang 3 Trang Độc Lập -->
        <div class="pt-3 space-y-2.5">
          <button onclick="loginAndRedirect('student', 'student.html')"
            class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-cyan-300 to-teal-300 hover:from-cyan-200 hover:to-teal-200 text-slate-950 font-extrabold text-sm sm:text-base shadow-lg transition transform active:scale-[0.98] flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-graduate"></i>
            <span>Đăng Nhập Học Sinh</span>
          </button>

          <button onclick="loginAndRedirect('parent', 'parent.html')"
            class="w-full py-3.5 px-4 rounded-2xl bg-white/25 hover:bg-white/35 border border-white/40 text-white font-extrabold text-sm sm:text-base shadow-md transition transform active:scale-[0.98] flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-shield"></i>
            <span>Đăng Nhập Phụ Huynh</span>
          </button>

          <button onclick="loginAndRedirect('teacher', 'teacher.html')"
            class="w-full py-3.5 px-4 rounded-2xl bg-slate-900/65 hover:bg-slate-900/85 border border-white/25 text-cyan-200 font-extrabold text-sm sm:text-base shadow-md transition transform active:scale-[0.98] flex items-center justify-center gap-2">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>Đăng Nhập Giáo Viên</span>
          </button>
        </div>
      </div>

      <!-- Tài khoản mẫu 1 chạm -->
      <div class="mt-6 pt-4 border-t border-white/20">
        <div class="text-[11px] text-center text-cyan-100/90 font-semibold mb-2">Đăng nhập nhanh tài khoản mẫu:</div>
        <div class="grid grid-cols-3 gap-1.5 text-[11px]">
          <button onclick="fastFillAndGo('HS01', 'NGÔ HOÀNG MINH ĐẠT', 'student', 'student.html')" class="p-2 rounded-xl bg-white/15 hover:bg-white/25 text-center font-bold">
            HS01<br><span class="font-normal text-cyan-200">Học sinh</span>
          </button>
          <button onclick="fastFillAndGo('PH01', 'PHỤ HUYNH EM ĐẠT', 'parent', 'parent.html')" class="p-2 rounded-xl bg-white/15 hover:bg-white/25 text-center font-bold">
            PH01<br><span class="font-normal text-amber-200">Phụ huynh</span>
          </button>
          <button onclick="fastFillAndGo('GV01', 'CÔ HIỀN', 'teacher', 'teacher.html')" class="p-2 rounded-xl bg-white/15 hover:bg-white/25 text-center font-bold">
            GV01<br><span class="font-normal text-emerald-300">Giáo viên</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-[11px] text-white/70 pb-1">
    Trang độc lập: <b>login.html</b> • Dữ liệu đồng bộ thời gian thực qua Google Sheets
  </footer>

  <script>
    // =========================================================================
    // CẤU HÌNH ĐỒNG BỘ GOOGLE SHEETS THỜI GIAN THỰC (DÙNG CHUNG 4 TRANG)
    // =========================================================================
    const DEFAULT_GSHEET_URL = "";
    const DB_KEY = 'HUE_CAMPUS_STANDALONE_DB_V2';
    const URL_KEY = 'HUE_CAMPUS_GSHEET_WEBAPP_URL';
    const SESSION_KEY = 'HUE_CAMPUS_ACTIVE_SESSION';
    const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('hue_smart_campus_sync_v2') : null;

    const INITIAL_DB = {
      users: [
        { ID: 'HS01', HoTen: 'NGÔ HOÀNG MINH ĐẠT', VaiTro: 'student', Lop_DonVi: '12 Toán Lí', DiemRenLuyen: 95, TrangThai: 'Chờ phụ huynh duyệt' },
        { ID: 'HS02', HoTen: 'NGÔ HOÀNG ANH QUÂN', VaiTro: 'student', Lop_DonVi: '12 Toán Lí', DiemRenLuyen: 98, TrangThai: 'Đi trễ - Vào lớp lúc 20:43' },
        { ID: 'HS03', HoTen: 'NGUYỄN HOÀNG BẢO ANH', VaiTro: 'student', Lop_DonVi: '12 Toán Lí', DiemRenLuyen: 100, TrangThai: 'Đang ở lớp' },
        { ID: 'PH01', HoTen: 'PHỤ HUYNH EM ĐẠT', VaiTro: 'parent', Lop_DonVi: 'HS01', DiemRenLuyen: 100, TrangThai: 'Liên kết HS01' },
        { ID: 'GV01', HoTen: 'CÔ HIỀN', VaiTro: 'teacher', Lop_DonVi: 'GVCN 12 Toán Lí', DiemRenLuyen: 100, TrangThai: 'Trực tuyến' }
      ],
      attendanceLogs: [
        { MaBanGhi: 'DD-01', MaHS: 'HS02', HoTen: 'NGÔ HOÀNG ANH QUÂN', Loai: 'Đi trễ', ThoiGian: '20:43 hôm nay', LyDo: 'Vào lớp muộn', BienDongDiem: '-2' },
        { MaBanGhi: 'DD-02', MaHS: 'HS03', HoTen: 'NGUYỄN HOÀNG BẢO ANH', Loai: 'Có mặt', ThoiGian: '07:05 hôm nay', LyDo: 'Báo danh đúng giờ', BienDongDiem: '0' }
      ],
      leaves: [
        {
          MaDon: 'NP-101',
          MaHS: 'HS01',
          HoTen: 'NGÔ HOÀNG MINH ĐẠT',
          NgayNghi: new Date().toISOString().split('T')[0],
          LoaiNghi: 'Nghỉ ốm / Bệnh',
          LyDo: 'bệnh',
          TrangThai: 'Chờ phụ huynh duyệt',
          ThoiGianGui: '07:10 hôm nay'
        }
      ],
      rooms: [
        { MaPhong: 'P101', TenPhong: 'Phòng Học 101', Loai: 'Phòng học thông minh', SucChua: 40, ThietBi: 'Máy chiếu, Điều hòa, Bảng từ', TinhTrang: 'Trống' },
        { MaPhong: 'P102', TenPhong: 'Phòng Học 102', Loai: 'Phòng học chuyên đề', SucChua: 40, ThietBi: 'Máy chiếu, Điều hòa, Âm thanh', TinhTrang: 'Đang sử dụng' },
        { MaPhong: 'PTH1', TenPhong: 'Phòng Thực Hành Lý - Tin', Loai: 'Phòng thí nghiệm', SucChua: 30, ThietBi: '25 Máy tính, Bộ thí nghiệm', TinhTrang: 'Trống' },
        { MaPhong: 'PH-A', TenPhong: 'Phòng Họp Nhóm A', Loai: 'Không gian làm việc', SucChua: 15, ThietBi: 'Màn hình TV 65", Wifi tốc độ cao', TinhTrang: 'Trống' }
      ],
      bookings: [
        {
          MaDat: 'DP-201',
          MaPhong: 'P102',
          TenPhong: 'Phòng Học 102',
          Ngay: new Date().toISOString().split('T')[0],
          KhungGio: '07:30 - 09:30',
          NguoiDat: 'GV. Cô Hiền (12 Toán Lí)',
          MucDich: 'Bồi dưỡng học sinh giỏi Vật Lí',
          TrangThai: 'Đã duyệt'
        }
      ]
    };

    function getGSheetUrl() {
      return localStorage.getItem(URL_KEY) || DEFAULT_GSHEET_URL || '';
    }

    function getDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      localStorage.setItem(DB_KEY, JSON.stringify(INITIAL_DB));
      return JSON.parse(JSON.stringify(INITIAL_DB));
    }

    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

    function setSession(userObj) {
      if (userObj) localStorage.setItem(SESSION_KEY, JSON.stringify(userObj));
      else localStorage.removeItem(SESSION_KEY);
    }

    // Chuyển trang thông minh: Hoạt động cả khi chạy file .html độc lập lẫn trong khung xem trước
    function goToStandalonePage(targetFile) {
      if (window.parent && window.parent !== window && typeof window.parent.navigatePage === 'function') {
        window.parent.navigatePage(targetFile);
      } else {
        window.location.href = targetFile;
      }
    }

    // Lưu DB & Đồng bộ hai chiều lên Google Sheets
    async function saveAndPushDB(db, notifyText) {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      if (bc) bc.postMessage({ type: 'SYNC_DB', db });
      if (typeof onDatabaseUpdated === 'function') onDatabaseUpdated(db);

      const url = getGSheetUrl();
      if (url) {
        updateSyncIndicator('syncing', 'Đang đồng bộ GSheet...');
        try {
          await fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'SYNC_ALL', data: db })
          });
          updateSyncIndicator('online', 'Google Sheets Real-time');
        } catch (e) {
          updateSyncIndicator('error', 'Lỗi mạng (Đã lưu cục bộ)');
        }
      } else {
        updateSyncIndicator('local', 'Real-time Local Sync');
      }
      if (notifyText) showToast(notifyText, 'success');
    }

    // Kéo dữ liệu mới nhất từ Google Sheets mỗi 4 giây
    async function pullFromGSheet(manual = false) {
      const url = getGSheetUrl();
      if (!url) {
        updateSyncIndicator('local', 'Real-time Local Sync');
        if (manual) showToast('Chưa gắn URL Google Sheets. Đang đồng bộ thời gian thực qua trình duyệt!', 'info');
        return;
      }
      try {
        const res = await fetch(url);
        const json = await res.json();
        if (json && json.status === 'success') {
          const current = getDB();
          if (Array.isArray(json.users) && json.users.length > 0) current.users = json.users;
          if (Array.isArray(json.attendanceLogs)) current.attendanceLogs = json.attendanceLogs;
          if (Array.isArray(json.leaves)) current.leaves = json.leaves;
          if (Array.isArray(json.bookings)) current.bookings = json.bookings;
          localStorage.setItem(DB_KEY, JSON.stringify(current));
          if (typeof onDatabaseUpdated === 'function') onDatabaseUpdated(current);
          updateSyncIndicator('online', 'Google Sheets Real-time');
          if (manual) showToast('Đã cập nhật dữ liệu mới nhất từ Google Sheets!', 'success');
        }
      } catch (err) {
        updateSyncIndicator('error', 'Chờ kết nối Google Sheets');
      }
    }

    function updateSyncIndicator(state, text) {
      const el = document.getElementById('pageSyncStatus');
      if (!el) return;
      const dotColor = state === 'online' ? 'bg-emerald-400' : state === 'syncing' ? 'bg-amber-400' : state === 'error' ? 'bg-rose-400' : 'bg-cyan-400';
      el.innerHTML = '<span class="w-2 h-2 rounded-full ' + dotColor + ' inline-block mr-1.5 animate-pulse"></span>' + text;
    }

    function showToast(msg, type = 'info') {
      let box = document.getElementById('toastBox');
      if (!box) {
        box = document.createElement('div');
        box.id = 'toastBox';
        box.className = 'fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0';
        document.body.appendChild(box);
      }
      const colors = {
        success: 'bg-emerald-600 border-emerald-400 text-white',
        error: 'bg-rose-600 border-rose-400 text-white',
        info: 'bg-slate-900 border-cyan-500 text-white'
      };
      const item = document.createElement('div');
      item.className = 'pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-medium transition-all duration-300 ' + (colors[type] || colors.info);
      item.textContent = msg;
      box.appendChild(item);
      setTimeout(() => { item.style.opacity = '0'; setTimeout(() => item.remove(), 300); }, 3500);
    }

    window.addEventListener('storage', (e) => {
      if (e.key === DB_KEY && e.newValue && typeof onDatabaseUpdated === 'function') {
        onDatabaseUpdated(JSON.parse(e.newValue));
      }
    });
    if (bc) {
      bc.onmessage = (ev) => {
        if (ev.data && ev.data.type === 'SYNC_DB' && typeof onDatabaseUpdated === 'function') {
          onDatabaseUpdated(ev.data.db);
        }
      };
    }
    setInterval(() => { if (getGSheetUrl()) pullFromGSheet(false); }, 4000);
  </script>
  <script>
    function fastFillAndGo(id, name, role, targetHtml) {
      document.getElementById('loginUserId').value = id;
      document.getElementById('loginUserName').value = name;
      loginAndRedirect(role, targetHtml);
    }

    function loginAndRedirect(role, targetHtml) {
      const id = document.getElementById('loginUserId').value.trim().toUpperCase();
      const name = document.getElementById('loginUserName').value.trim().toUpperCase();
      if (!id) {
        showToast('Vui lòng nhập Mã định danh (VD: HS01, PH01, GV01)!', 'error');
        return;
      }

      const db = getDB();
      let user = db.users.find(u => u.ID.toUpperCase() === id);
      if (!user) {
        user = {
          ID: id,
          HoTen: name || (role === 'teacher' ? 'GIÁO VIÊN' : role === 'parent' ? 'PHỤ HUYNH' : 'HỌC SINH'),
          VaiTro: role,
          Lop_DonVi: role === 'parent' ? 'HS01' : '12 Toán Lí',
          DiemRenLuyen: 100,
          TrangThai: role === 'student' ? 'Đang ở lớp' : 'Trực tuyến'
        };
        db.users.push(user);
        saveAndPushDB(db);
      } else if (name) {
        user.HoTen = name;
        saveAndPushDB(db);
      }

      setSession({ ...user, activeRole: role });
      goToStandalonePage(targetHtml);
    }

    function promptGSheetUrl() {
      const current = getGSheetUrl();
      const next = window.prompt('Dán URL Google Apps Script Web App dùng chung cho 4 trang:', current);
      if (next !== null) {
        localStorage.setItem(URL_KEY, next.trim());
        pullFromGSheet(true);
      }
    }

    window.onload = function() {
      pullFromGSheet(false);
    };
  </script>
</body>
</html>
