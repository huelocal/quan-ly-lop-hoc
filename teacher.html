<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giáo Viên - Smart Attendee</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase.config.js"></script>
    <style>
        body { margin: 0; min-height: 100vh; background: url('https://static.vinwonders.com/2023/02/kinh-thanh-hue-4.jpg') no-repeat center center fixed; background-size: cover; font-family: sans-serif; color: white; padding: 20px; box-sizing: border-box; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .card { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 300px; }
        .list-card { flex: 1; min-width: 400px; overflow-x: auto; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .btn-main { width: 100%; background: #55efc4; margin-top: 10px; padding: 12px; color: #000; }
        .btn-alert { width: 100%; background: #ff7675; margin-top: 10px; padding: 12px; color: #fff; }
        .btn-reset { width: 100%; background: #ffeaa7; margin-top: 10px; padding: 10px; color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #444; font-size: 14px; }
        .btn-del { background: #ff7675; color: white; }
        .btn-plus { background: #55efc4; color: #000; }
        .btn-minus { background: #ffeaa7; color: #000; }
        .btn-checkin { background: #74b9ff; color: #000; }
        .btn-approve { background: #00b894; color: white; width: 100%; margin-bottom: 5px; display: block; }
        .stats-bar { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; background: rgba(255,255,255,0.08); padding: 10px 15px; border-radius: 8px; }
        .badge-ok { color: #55efc4; font-weight: bold; }
        .badge-warn { color: #ffeaa7; font-weight: bold; }
        .badge-danger { color: #ff7675; font-weight: bold; }
        hr { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 18px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3 style="margin-top:0;">QUẢN LÝ LỚP HỌC</h3>
            <input type="text" id="hs_id" placeholder="Mã số (Ví dụ: HS01)">
            <input type="text" id="hs_name" placeholder="Họ và tên">
            <input type="text" id="hs_rfid" placeholder="Mã thẻ RFID (Tùy chọn)">
            <button class="btn-main" onclick="themHocSinh()">TẠO TÀI KHOẢN</button>

            <hr>
            <h4 style="margin:0 0 8px; color:#ffeaa7;">ĐIỀU HÀNH ĐẦU GIỜ</h4>
            <button class="btn-alert" onclick="kichHoatCanhBaoDo()">🚨 CẢNH BÁO ĐỎ (07:15)</button>
            <button class="btn-reset" onclick="resetNgayMoi()">🔄 LÀM MỚI ĐIỂM DANH NGÀY</button>
            <button class="btn-main" style="background:#636e72; color:#fff; margin-top:15px;" onclick="dangXuat()">THOÁT</button>
        </div>

        <div class="card list-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <h3 style="margin:0;">DANH SÁCH HỌC SINH</h3>
                <input type="text" id="search_box" placeholder="Tìm mã hoặc tên học sinh..." oninput="renderTable()" style="width:220px; margin:0; padding:8px 12px;">
            </div>

            <div class="stats-bar" id="stats-bar" style="margin-top:12px;">
                <span>Tổng sĩ số: <b id="stat-total">0</b></span>
                <span>Có mặt: <b class="badge-ok" id="stat-present">0</b></span>
                <span>Có phép: <b class="badge-warn" id="stat-excused">0</b></span>
                <span>Chưa điểm danh / Vắng: <b class="badge-danger" id="stat-absent">0</b></span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Mã số</th>
                        <th>Họ và tên</th>
                        <th>Trạng thái</th>
                        <th>Điểm RL</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="student-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        let allStudents = {};

        function themHocSinh() {
            var id = document.getElementById('hs_id').value.trim().toUpperCase();
            var ten = document.getElementById('hs_name').value.trim();
            var rfid = document.getElementById('hs_rfid').value.trim();
            if (!id || !ten) return alert("Vui lòng nhập đủ thông tin!");

            database.ref('users/' + id).set({
                ten: ten,
                rfid: rfid || id,
                diem_ren_luyen: 100,
                trang_thai: "Chưa điểm danh",
                thoi_gian: "",
                canh_bao_do: false
            }).then(() => {
                alert("Đã thêm học sinh " + ten);
                document.getElementById('hs_id').value = "";
                document.getElementById('hs_name').value = "";
                document.getElementById('hs_rfid').value = "";
            });
        }

        database.ref('users').on('value', (snap) => {
            allStudents = snap.val() || {};
            renderTable();
        });

        function renderTable() {
            var list = document.getElementById('student-list');
            var keyword = (document.getElementById('search_box').value || "").toLowerCase();
            list.innerHTML = "";

            let total = 0, present = 0, excused = 0, absent = 0;

            Object.keys(allStudents).forEach((key) => {
                var s = allStudents[key];
                total++;

                var tt = s.trang_thai || "Chưa điểm danh";
                if (tt.includes("Có mặt") || tt.includes("Đã điểm danh")) present++;
                else if (tt.includes("Đã duyệt nghỉ")) excused++;
                else absent++;

                if (keyword && !key.toLowerCase().includes(keyword) && !(s.ten || "").toLowerCase().includes(keyword)) {
                    return;
                }

                var lyDoHienThi = s.ly_do ? `<br><small style="color:#ffeaa7">📝 Đơn nghỉ: ${s.ly_do}</small>` : "";
                var timeHienThi = s.thoi_gian ? `<br><small style="color:#b2bec3">🕒 ${s.thoi_gian}</small>` : "";
                var nutDuyet = s.ly_do ? `<button class="btn-approve" onclick="pheDuyet('${key}')">DUYỆT NGHỈ</button>` : "";

                var statusClass = "";
                if (tt.includes("Có mặt") || tt.includes("Đã điểm danh")) statusClass = "badge-ok";
                else if (tt.includes("Đã duyệt nghỉ")) statusClass = "badge-warn";
                else if (tt.includes("Vắng") || s.canh_bao_do) statusClass = "badge-danger";

                var row = `<tr>
                    <td><b>${key}</b></td>
                    <td><b>${s.ten}</b>${lyDoHienThi}${timeHienThi}</td>
                    <td class="${statusClass}">${tt}</td>
                    <td style="font-weight:bold; color:#55efc4">${s.diem_ren_luyen ?? 100}</td>
                    <td>
                        ${nutDuyet}
                        <button class="btn-checkin" title="Điểm danh thủ công" onclick="diemDanhThuCong('${key}')">✓</button>
                        <button class="btn-plus" onclick="changeScore('${key}', 1)">+</button>
                        <button class="btn-minus" onclick="changeScore('${key}', -1)">-</button>
                        <button class="btn-del" onclick="xoaHS('${key}')">Xóa</button>
                    </td>
                </tr>`;
                list.innerHTML += row;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = present;
            document.getElementById('stat-excused').innerText = excused;
            document.getElementById('stat-absent').innerText = absent;
        }

        function diemDanhThuCong(idHS) {
            const now = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            database.ref('users/' + idHS).update({
                trang_thai: "Có mặt (GV xác nhận)",
                thoi_gian: now,
                canh_bao_do: false
            });
        }

        function pheDuyet(idHS) {
            database.ref('users/' + idHS).update({
                trang_thai: "Đã duyệt nghỉ",
                ly_do: null,
                canh_bao_do: false
            });
        }

        function kichHoatCanhBaoDo() {
            let count = 0;
            Object.keys(allStudents).forEach((key) => {
                let s = allStudents[key];
                let tt = s.trang_thai || "Chưa điểm danh";
                if (tt === "Chưa điểm danh" && !s.ly_do) {
                    count++;
                    database.ref('users/' + key).update({
                        trang_thai: "🚨 Vắng không phép (Cảnh báo đỏ 07:15)",
                        canh_bao_do: true
                    });
                }
            });
            if (count > 0) {
                alert("Đã kích hoạt CẢNH BÁO ĐỎ 07:15 tới phụ huynh của " + count + " học sinh chưa điểm danh!");
            } else {
                alert("Tất cả học sinh đều đã có mặt hoặc có đơn xin nghỉ phép!");
            }
        }

        function resetNgayMoi() {
            if (!confirm("Đặt lại trạng thái toàn bộ lớp về 'Chưa điểm danh' cho buổi học mới?")) return;
            Object.keys(allStudents).forEach((key) => {
                database.ref('users/' + key).update({
                    trang_thai: "Chưa điểm danh",
                    thoi_gian: "",
                    canh_bao_do: false
                });
            });
        }

        function changeScore(idHS, amount) {
            const studentRef = database.ref('users/' + idHS + '/diem_ren_luyen');
            studentRef.once('value').then((snapshot) => {
                let currentScore = snapshot.val() || 0;
                studentRef.set(currentScore + amount);
            });
        }

        function xoaHS(id) {
            if (confirm("Xóa học sinh " + id + "?")) {
                database.ref('users/' + id).remove();
            }
        }

        function dangXuat() {
            localStorage.removeItem('smart_attendee_gv');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
