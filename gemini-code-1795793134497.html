<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Smart Attendee</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase.config.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url('https://static.vinwonders.com/2023/02/kinh-thanh-hue-4.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 28px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 { margin: 0 0 6px; color: #55efc4; text-align: center; }
        .sub { margin: 0 0 20px; font-size: 13px; color: #dfe6e9; text-align: center; }
        .role-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
        .tab-btn {
            flex: 1;
            padding: 9px 6px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .tab-btn.active { background: #55efc4; color: #000; border-color: #55efc4; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }
        .btn-main {
            width: 100%;
            background: #55efc4;
            margin-top: 12px;
            padding: 12px;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .msg-err { color: #ff7675; font-size: 13px; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>SMART ATTENDEE</h2>
        <p class="sub">Hệ thống điểm danh &amp; quản lý nề nếp</p>

        <div class="role-tabs">
            <button class="tab-btn active" id="btn-tab-gv" onclick="doiTab('gv')">Giáo viên</button>
            <button class="tab-btn" id="btn-tab-hs" onclick="doiTab('hs')">Học sinh</button>
            <button class="tab-btn" id="btn-tab-ph" onclick="doiTab('ph')">Phụ huynh</button>
        </div>

        <div id="box-gv">
            <input type="text" id="gv_user" placeholder="Tên đăng nhập (mặc định: gv)">
            <input type="password" id="gv_pass" placeholder="Mật khẩu (mặc định: 123456)">
            <button class="btn-main" onclick="loginGV()">ĐĂNG NHẬP GIÁO VIÊN</button>
        </div>

        <div id="box-hs" style="display:none;">
            <input type="text" id="hs_id" placeholder="Mã số học sinh (Ví dụ: HS01)">
            <button class="btn-main" onclick="loginHS()">VÀO TRANG HỌC SINH</button>
        </div>

        <div id="box-ph" style="display:none;">
            <input type="text" id="ph_hs_id" placeholder="Mã số học sinh của con (Ví dụ: HS01)">
            <button class="btn-main" onclick="loginPH()">VÀO TRANG PHỤ HUYNH</button>
        </div>

        <div id="err-box" class="msg-err"></div>
    </div>

    <script>
        function doiTab(role) {
            document.getElementById('err-box').innerText = "";
            ['gv', 'hs', 'ph'].forEach((r) => {
                document.getElementById('box-' + r).style.display = (r === role) ? 'block' : 'none';
                document.getElementById('btn-tab-' + r).classList.toggle('active', r === role);
            });
        }

        function loginGV() {
            var u = document.getElementById('gv_user').value.trim();
            var p = document.getElementById('gv_pass').value.trim();
            if (u === 'gv' && p === '123456') {
                localStorage.setItem('sa_role', 'gv');
                window.location.href = 'giaovien.html';
            } else {
                document.getElementById('err-box').innerText = "Sai tài khoản hoặc mật khẩu giáo viên!";
            }
        }

        function loginHS() {
            var id = document.getElementById('hs_id').value.trim().toUpperCase();
            if (!id) return (document.getElementById('err-box').innerText = "Vui lòng nhập mã số học sinh!");
            database.ref('users/' + id).once('value').then((snap) => {
                if (snap.exists()) {
                    localStorage.setItem('sa_student_id', id);
                    window.location.href = 'hocsinh.html';
                } else {
                    document.getElementById('err-box').innerText = "Không tìm thấy mã học sinh " + id;
                }
            });
        }

        function loginPH() {
            var id = document.getElementById('ph_hs_id').value.trim().toUpperCase();
            if (!id) return (document.getElementById('err-box').innerText = "Vui lòng nhập mã số học sinh của con!");
            database.ref('users/' + id).once('value').then((snap) => {
                if (snap.exists()) {
                    localStorage.setItem('sa_parent_student_id', id);
                    window.location.href = 'phuhuynh.html';
                } else {
                    document.getElementById('err-box').innerText = "Không tìm thấy hồ sơ cho mã " + id;
                }
            });
        }
    </script>
</body>
</html>
