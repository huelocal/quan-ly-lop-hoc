<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học Sinh - Smart Attendee</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase.config.js"></script>
    <style>
        body { margin: 0; min-height: 100vh; background: url('https://static.vinwonders.com/2023/02/kinh-thanh-hue-4.jpg') no-repeat center center fixed; background-size: cover; font-family: sans-serif; color: white; padding: 20px; display: flex; justify-content: center; align-items: center; box-sizing: border-box; }
        .card { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); padding: 24px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 420px; }
        h3 { margin-top: 0; color: #55efc4; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #444; font-size: 14px; }
        textarea { width: 100%; box-sizing: border-box; padding: 10px; margin: 12px 0 8px; border-radius: 5px; border: none; min-height: 75px; font-family: sans-serif; }
        button { width: 100%; padding: 11px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 6px; }
        .btn-main { background: #55efc4; color: #000; }
        .btn-exit { background: #636e72; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h3>GÓC HỌC SINH</h3>
        <div class="row"><span>Mã số:</span><b id="hs_code">---</b></div>
        <div class="row"><span>Họ và tên:</span><b id="hs_ten">---</b></div>
        <div class="row"><span>Trạng thái:</span><b id="hs_tt" style="color:#55efc4">---</b></div>
        <div class="row"><span>Điểm rèn luyện:</span><b id="hs_drl" style="color:#ffeaa7">100</b></div>

        <textarea id="ly_do" placeholder="Nhập lý do xin nghỉ phép gửi giáo viên..."></textarea>
        <button class="btn-main" onclick="guiNghiPhep()">GỬI ĐƠN XIN NGHỈ</button>
        <button class="btn-exit" onclick="window.location.href='index.html'">THOÁT</button>
    </div>

    <script>
        var idHS = localStorage.getItem('sa_student_id');
        if (!idHS) window.location.href = 'index.html';

        database.ref('users/' + idHS).on('value', (snap) => {
            var s = snap.val();
            if (!s) return;
            document.getElementById('hs_code').innerText = idHS;
            document.getElementById('hs_ten').innerText = s.ten || "---";
            document.getElementById('hs_tt').innerText = s.trang_thai || "Chưa điểm danh";
            document.getElementById('hs_drl').innerText = s.diem_ren_luyen ?? 100;
        });

        function guiNghiPhep() {
            var lyDo = document.getElementById('ly_do').value.trim();
            if (!lyDo) return alert("Nhập lý do nghỉ phép trước nhé!");
            database.ref('users/' + idHS).update({
                ly_do: lyDo,
                trang_thai: "Chờ duyệt nghỉ"
            }).then(() => {
                alert("Đã gửi đơn xin nghỉ!");
                document.getElementById('ly_do').value = "";
            });
        }
    </script>
</body>
</html>
