<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendee - Hệ thống điểm danh thông minh</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase.config.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url('https://static.vinwonders.com/2023/02/kinh-thanh-hue-4.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 { margin: 0 0 5px; color: #55efc4; letter-spacing: 1px; }
        p.slogan { margin: 0 0 25px; font-size: 13px; color: #dfe6e9; }
        .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #55efc4;
            color: #000;
            border-color: #55efc4;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }
        .btn-main {
            width: 100%;
            background: #55efc4;
            margin-top: 15px;
            padding: 12px;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-main:hover { opacity: 0.9; }
        .error-msg {
            color: #ff7675;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>SMART ATTENDEE</h2>
        <p class="slogan">Quản lý thông minh, trọn vẹn an tâm</p>

        <div class="tab-group">
            <button class="tab-btn active" id="tab-hs" onclick="chonVaiTro('hs')">HỌC SINH / PHỤ HUYNH</button>
            <button class="tab-btn" id="tab-gv" onclick="chonVaiTro('gv')">GIÁO VIÊN</button>
        </div>

        <div id="form-hs">
            <input type="text" id="login_hs_id" placeholder="Nhập mã số học sinh (Ví dụ: HS01)">
            <button class="btn-main" onclick="dangNhapHS()">TRUY CẬP HỆ THỐNG</button>
        </div>

        <div id="form-gv" style="display: none;">
            <input type="text" id="login_gv_user" placeholder="Tài khoản giáo viên (admin)">
            <input type="password" id="login_gv_pass" placeholder="Mật khẩu (123456)">
            <button class="btn-main" onclick="dangNhapGV()">ĐĂNG NHẬP QUẢN LÝ</button>
        </div>

        <div id="error-msg" class="error-msg"></div>
    </div>

    <script>
        function chonVaiTro(role) {
            document.getElementById('error-msg').style.display = 'none';
            if (role === 'hs') {
                document.getElementById('tab-hs').classList.add('active');
                document.getElementById('tab-gv').classList.remove('active');
                document.getElementById('form-hs').style.display = 'block';
                document.getElementById('form-gv').style.display = 'none';
            } else {
                document.getElementById('tab-gv').classList.add('active');
                document.getElementById('tab-hs').classList.remove('active');
                document.getElementById('form-gv').style.display = 'block';
                document.getElementById('form-hs').style.display = 'none';
            }
        }

        function hienLoi(msg) {
            var el = document.getElementById('error-msg');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function dangNhapHS() {
            var id = document.getElementById('login_hs_id').value.trim().toUpperCase();
            if (!id) return hienLoi("Vui lòng nhập mã số học sinh!");

            database.ref('users/' + id).once('value').then((snap) => {
                if (snap.exists()) {
                    localStorage.setItem('smart_attendee_hs_id', id);
                    window.location.href = 'hocsinh.html';
                } else {
                    hienLoi("Không tìm thấy mã học sinh " + id + " trên hệ thống!");
                }
            }).catch((err) => {
                hienLoi("Lỗi kết nối Firebase: " + err.message);
            });
        }

        function dangNhapGV() {
            var user = document.getElementById('login_gv_user').value.trim();
            var pass = document.getElementById('login_gv_pass').value.trim();
            if (user === 'admin' && pass === '123456') {
                localStorage.setItem('smart_attendee_gv', 'true');
                window.location.href = 'giaovien.html';
            } else {
                hienLoi("Sai tài khoản hoặc mật khẩu giáo viên!");
            }
        }
    </script>
</body>
</html>
